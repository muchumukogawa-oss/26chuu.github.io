<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おもいのパレット-タイトル</title>
    <!-- Kosugi Maru フォントを追加 -->
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 全体 -->
    <div class="page-container">
      <!-- ロゴ -->
      <div class="logo">
        <img src="img/logo.png" alt="ロゴ" />
      </div>

      <!-- はじめる -->
      <button class="custom-btn start-btn"><span class="btn-text">はじめる</span></button>

      <!-- 感情キャラたち -->
      <img src="img/anger.png" alt="怒りくん" class="emotion anger" />
      <img src="img/trust.png" alt="信頼くん" class="emotion trust" />
      <img src="img/comfortable.png" alt="快適くん" class="emotion comfortable" />
      <img src="img/sad.png" alt="悲しみくん" class="emotion sad" />
    </div>
    <script src="script.js"></script>
  </body>
</html>
