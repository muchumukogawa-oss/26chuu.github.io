<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おもいのパレット-第1象限の色選択</title>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 全体 -->
    <div class="page-container">
      <!-- 色選択 -->
      <div>
        <h2 class="h2_color" style="text-align: center">あなたの思う「おもい」の色を<br />選んでタップしてね</h2>
      </div>

      <div class="button-16grid" id="area1">
        <!-- エリア別軸ラベル -->
        <p class="upper_left">高</p>
        <p class="lower_right">快</p>
        <!-- 色ボタン 0~24 -->
        <button id="#F4BB31"><!-- 0 --></button>
        <button id="#E1B70E"><!-- 1 --></button>
        <button id="#E45D37"><!-- 2 --></button>
        <button id="#D6BA00"><!-- 3 --></button>
        <button id="#F2BF00"><!-- 4 --></button>
        <button id="#D33941"><!-- 5 --></button>
        <button id="#F7A631"><!-- 6 --></button>
        <button id="#DA425A"><!-- 7 --></button>
        <button id="#F6CC37"><!-- 8 --></button>
        <button id="#F78E2E"><!-- 9 --></button>
        <button id="#EF8011"><!-- 10 --></button>
        <button id="#EE7722"><!-- 11 --></button>
        <button id="#C92F45"><!-- 12 --></button>
        <button id="#F0CB73"><!-- 13 --></button>
        <button id="#C43F3D"><!-- 14 --></button>
        <button id="#EB6976"><!-- 15 --></button>
        <button id="#EA8F98"><!-- 16 --></button>
        <button id="#2F7DC5"><!-- 17 --></button>
        <button id="#FFD934"><!-- 18 --></button>
        <button id="#B80535"><!-- 19 --></button>
        <button id="#EFCE1F"><!-- 20 --></button>
        <button id="#FAC422"><!-- 21 --></button>
        <button id="#ECC945"><!-- 22 --></button>
        <button id="#F28436"><!-- 23 --></button>
        <button id="#F5D269"><!-- 24 --></button>
      </div>

      <!-- 戻る -->
      <a href="AreaSelect.html">
        <button id="backBtn" class="custom-btn back-btn">
          <span class="btn-text">戻る</span>
        </button>
      </a>
    </div>
    <!-- 確認ポップアップ -->
    <div id="confirmPopup" class="confirm-popup" style="display: none">
      <div class="popup-content">
        <p class="popup-text">これでいいですか？</p>
        <div class="color-circle" id="selectedColor"></div>
        <div class="confirm-buttons">
          <button id="yesBtn" class="custom-btn yes-btn">
            <span class="btn-text">はい</span>
          </button>
          <button id="noBtn" class="no-btn">
            <span class="btn-text">いいえ</span>
          </button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
