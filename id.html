<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おもいのパレット-ニックネーム入力</title>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-container">
      <div class="card">
        <p class="title">ニックネーム入力</p>
        <hr />
        <p>ニックネームを入力して「次へ進む」ボタンを押してください。</p>
        <input id="nicknameInput" class="input-box" type="text" placeholder="ニックネームを入力" maxlength="20" />
        <button id="confirmNickname" class="custom-btn" disabled>
          <span class="btn-text">次へ</span>
        </button>
        <p id="status" class="status-text">ニックネームを入力すると、次へ進めます。</p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
