<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おもいのパレット-ID入力</title>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-container">
      <div class="card">
        <p class="title">ID入力</p>
        <hr />
        <p>IDを入力して「次へ」ボタンを押してください。</p>
        <input
          id="nicknameInput"
          class="input-box"
          type="text"
          inputmode="text"
          pattern="[A-Fa-f][A-Za-z0-9]*"
          placeholder="例:A01"
          maxlength="20"
          autocomplete="off"
        />
        <button id="confirmNickname" class="custom-btn" disabled>
          <span class="btn-text">次へ</span>
        </button>
        <p id="status" class="status-text">IDの先頭をA〜Fにして入力してください。</p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
