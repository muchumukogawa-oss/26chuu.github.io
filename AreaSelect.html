<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おもいのパレット-４象限選択</title>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 全体 -->
    <div class="page-container">
      <!-- 色選択 -->
      <div>
        <h2 id="h2" style="text-align: center">あなたの思う<br />「おもい」のエリアを<br />選んでタップしてね</h2>
      </div>
      <div class="area-selection-grid" aria-label="象限選択">
        <span class="axis-label positive-label">高</span>
        <span class="axis-label negative-label">低</span>
        <span class="axis-label static-label">不快</span>
        <span class="axis-label dynamic-label">快</span>

        <a class="area-tile" href="2_aera.html" aria-label="エリア2を選択">
          <img src="img/area2.jpg" alt="エリア2" />
        </a>
        <a class="area-tile" href="1_aera.html" aria-label="エリア1を選択">
          <img src="img/area1.jpg" alt="エリア1" />
        </a>
        <a class="area-tile" href="3_aera.html" aria-label="エリア3を選択">
          <img src="img/area3.jpg" alt="エリア3" />
        </a>
        <a class="area-tile" href="4_aera.html" aria-label="エリア4を選択">
          <img src="img/area4.jpg" alt="エリア4" />
        </a>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
