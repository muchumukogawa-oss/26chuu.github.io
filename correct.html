<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おもいのパレット-正解表示</title>
    <!-- Kosugi Maru フォントを追加 -->
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-container correct-page">
      <h3 id="h3">シチュエーションに合う<br />感情語とその意味は</h3>

      <div id="correctEmotionSummary" class="correct-emotion-summary">
        <div class="correct-item-meta">
          <div id="emotionNumberLabel" class="emotion-number-label"></div>
          <div class="emotion-word-block">
            <span id="emotionColorBarTop" class="emotion-color-divider" aria-hidden="true"></span>
            <div id="emotionWord" class="emotion-word"></div>
            <span id="emotionColorBarBottom" class="emotion-color-divider" aria-hidden="true"></span>
            <span id="emotionColorCircle" class="emotion-color-circle" role="img" aria-label="感情語の色"></span>
          </div>
          <img id="answerImage" alt="意味画像" />
        </div>
      </div>
      <p>縦にスクロールすることができます</p>
      <!-- 評価2 -->
      <div class="rating-group" role="radiogroup" aria-label="評価2の選択">
        <h2 style="text-align: center; margin: 0; width: 100%">評価②</h2>
        <p style="margin: 0 0 8px; text-align: center; width: 100%">色と感情語が合っていましたか？</p>
        <div class="rating-scale-labels">
          <span>合っていない</span>
          <span>合っている</span>
        </div>
        <div class="rating-options">
          <label class="rating-option">
            <span class="rating-label">1</span>
            <input type="radio" name="situation-rating" value="1" />
          </label>
          <label class="rating-option">
            <span class="rating-label">2</span>
            <input type="radio" name="situation-rating" value="2" />
          </label>
          <label class="rating-option">
            <span class="rating-label">3</span>
            <input type="radio" name="situation-rating" value="3" />
          </label>
          <label class="rating-option">
            <span class="rating-label">4</span>
            <input type="radio" name="situation-rating" value="4" />
          </label>
        </div>
      </div>
      <a id="nextQuestionLink" href="ques.html"
        ><button id="reviewNextBtn" class="custom-btn" disabled>
          <span class="btn-text">次の問題へ</span>
        </button></a
      >
      <p id="nextQuestionStatus" class="next-question-status" role="status" aria-live="polite" hidden>
        次の問題を準備中…
      </p>
      <script src="script.js"></script>
    </div>
  </body>
</html>
