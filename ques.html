<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おもいのパレット-問題表示</title>
    <!-- Kosugi Maru フォントを追加 -->
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="movie-page">
    <div class="page-container">
      <!-- 動画 -->
        <h3 id="h3" style="text-align: center">
          次のシチュエーションに合う感情を<br />イメージしてください
        </h3>
        <p>第<span id="questionNumberLabel">1</span>問</p>
        <div id="questionImageFrame">
          <img id="questionImage" alt="問題" />
        </div>

        <!-- <div class="next"> -->
          <button id="playMovieBtn" class="custom-btn">
            <span class="btn-text">問題表示</span>
          </button>
          <p>問題は1回(10秒間)表示されます</p>
        <!-- </div> -->

      <!-- 次へ -->
      <div class="next">
        <a id="areaSelectLink" href="AreaSelect.html">
          <button id="nextBtn" class="custom-btn ">
            <span class="btn-text">色選択へ</span>
          </button>
        </a>
      </div>
    <script src="script.js"></script>
  </body>
</html>
