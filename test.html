<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おもいのパレット-ニックネーム入力</title>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-container">
      <div class="card">
        <p class="title">ニックネーム入力</p>
        <hr />
        <p>ニックネームを入力して「次へ進む」ボタンを押してください。</p>
        <input id="nicknameInput" class="input-box" type="text" placeholder="ニックネームを入力" maxlength="20" />
        <button id="confirmNickname" class="custom-btn" disabled>
          <span class="btn-text">次へ</span>
        </button>
        <p id="status" class="status-text">ニックネームを入力すると、次へ進めます。</p>
      </div>
    </div>
    <script>
      const nicknameInput = document.getElementById('nicknameInput');
      const confirmBtn = document.getElementById('confirmNickname');
      const status = document.getElementById('status');
      let nickname = '';

      const setStatus = (text) => {
        status.textContent = text;
      };

      const updateConfirmButton = () => {
        const value = nicknameInput.value.trim();
        const enabled = value.length > 0;

        confirmBtn.disabled = !enabled;
        confirmBtn.style.opacity = enabled ? '1' : '0.5';
        confirmBtn.style.cursor = enabled ? 'pointer' : 'not-allowed';

        if (!enabled) {
          setStatus('ニックネームを入力すると、次へ進めます。');
        }
      };

      nicknameInput.addEventListener('input', updateConfirmButton);

      confirmBtn.addEventListener('click', () => {
        const value = nicknameInput.value.trim();
        if (!value) {
          setStatus('ニックネームを入力してください。');
          return;
        }

        nickname = value;
        localStorage.setItem('nickname', nickname);
        localStorage.setItem('questionProgress', '0');
        localStorage.removeItem('usedQuestionImages');
        setStatus(`「${nickname}」で入力しました。次のページへ進みます...`);

        setTimeout(() => {
          window.location.href = 'play.html';
        }, 500);
      });

      updateConfirmButton();
    </script>
  </body>
</html>
